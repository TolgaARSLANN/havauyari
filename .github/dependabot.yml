# Bağımlılık güncellemeleri ve güvenlik yamaları için haftalık PR'lar
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Python sürümü CI (setup-python "3.11") ve requires-python ile birlikte, elle yükseltilir.
    # Yalnızca yama sürümleri (3.11.x) otomatik gelir; test edilen ortamla imaj ayrışmasın.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
