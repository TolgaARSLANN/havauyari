name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["izleme/**"]     # günlük tahmin kayıtları kodu değiştirmez
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api,ui]"
      - run: ruff check src tests
      - run: pytest -q

  # Günlük iş yalnızca çekirdek bağımlılıklarla çalışır: geliştirme paketlerine (matplotlib vb.)
  # sızan bir içe aktarma, testlerde görünmez ama işi açılışta çökertir
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -c "import havauyari.ops.daily"

  # Faz 7.2: imaj derlenir, API ve pano konteynerde başlatılıp sağlık kontrolünden geçer
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: havauyari:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: API sağlık kontrolü (model yüklü olmalı)
        run: |
          docker run -d --name api -p 8000:8000 havauyari:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health > health.json && break; sleep 2; done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['model_loaded'], h"
      - name: Pano sağlık kontrolü
        run: |
          docker run -d --name ui -p 8501:8501 havauyari:ci \
            streamlit run src/havauyari/ui/app.py --server.address 0.0.0.0 --server.port 8501
          for i in $(seq 1 30); do curl -fsS localhost:8501/_stcore/health && break; sleep 2; done
          curl -fsS localhost:8501/_stcore/health
      - name: Konteyner günlükleri
        if: failure()
        run: |
          docker logs api || true
          docker logs ui || true
