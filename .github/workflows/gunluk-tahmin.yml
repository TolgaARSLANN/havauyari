# Faz 7.3-7.4: günlük tahmin, tahmin kaydı ve canlı izleme.
# Her gün 08.17 TSİ'de (05.17 UTC) tüm istasyonlar için 24 saat sonrasının tahmini üretilir,
# dünkü tahminler gerçekleşen ölçümle karşılaştırılır ve sonuç izleme/ klasörüne işlenir.
# Canlı hata geri testin çok üstüne çıkarsa "sapma" etiketli bir konu açılır.
name: Günlük tahmin

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write      # izleme/ kayıtlarını depoya işlemek için
  issues: write        # sapma konusu için

concurrency:
  group: gunluk-tahmin
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Tahmin üret ve dünkü tahminleri değerlendir
        run: python -m havauyari.ops.daily --summary "$GITHUB_STEP_SUMMARY"
      - name: Kayıtları depoya işle
        run: |
          git config user.name "havauyari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add izleme/
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Gunluk tahmin: $(date -u +%F) [skip ci]"
          git pull --rebase
          git push
      - name: Sapma varsa konu aç
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drift=$(python3 -c "import json; print(json.load(open('izleme/durum.json'))['drift'])")
          if [ "$drift" != "True" ]; then echo "Sapma yok"; exit 0; fi
          reason=$(python3 -c "import json; print(json.load(open('izleme/durum.json'))['reason'])")
          body="$reason. Ayrıntılar: izleme/durum.json ve izleme/tahmin_kaydi.csv ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh label create sapma --color C4401A --description "Canlı hata geri testin çok üstünde" --force
          existing=$(gh issue list --label sapma --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$(date -u +%F): $body"
          else
            gh issue create --title "Canlı tahmin hatası arttı (sapma)" --label sapma --body "$body"
          fi
