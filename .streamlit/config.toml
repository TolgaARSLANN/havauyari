[server]
# Tarayıcıyı kendisi açmaya çalışmaz ve ilk çalıştırmadaki e-posta sorusunu atlar
headless = true

[browser]
gatherUsageStats = false

[client]
# Geliştirici menüsü yerine sade araç çubuğu
toolbarMode = "minimal"

# Tasarım sistemi (Parçacık Defteri): src/havauyari/ui/theme.py ile aynı renkler. Açık ve koyu tema ayrı
# tanımlanır; böylece Streamlit sistem tercihine göre geçiş yapar ve özel CSS ile uyumlu kalır.
[theme.light]
primaryColor = "#2B4C7E"
backgroundColor = "#F3EFE7"
secondaryBackgroundColor = "#EAE4D8"
textColor = "#1C1B19"

[theme.dark]
primaryColor = "#93B4E6"
backgroundColor = "#12110F"
secondaryBackgroundColor = "#191815"
textColor = "#EDE7DC"
