[server]
# Tarayıcıyı kendisi açmaya çalışmaz ve ilk çalıştırmadaki e-posta sorusunu atlar
headless = true

[browser]
gatherUsageStats = false

[client]
# Geliştirici menüsü yerine sade araç çubuğu
toolbarMode = "minimal"

# Tasarım sistemi: src/havauyari/ui/theme.py ile aynı renkler. Açık ve koyu tema ayrı
# tanımlanır; böylece Streamlit sistem tercihine göre geçiş yapar ve özel CSS ile uyumlu kalır.
[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#0F172A"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#141C2E"
textColor = "#F8FAFC"
